[project]
name = "aira"
version = "0.1.0"
description = "Zero-dependency ticket board and mailboxes that turn parallel AI agent sessions into a coordinated team."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = ["ai-agents", "claude-code", "ticketing", "multi-agent", "coordination"]

[project.urls]
Homepage = "https://github.com/shahabeddin/aira"
Issues = "https://github.com/shahabeddin/aira/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
